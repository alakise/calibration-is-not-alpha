[project]
name = "jev-crypto-research"
version = "0.1.0"
description = "Reproducible, transaction-cost-aware evaluation of calibrated System-One judgments in short-horizon cryptocurrency markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.2",
  "pandas>=2.3",
  "pydantic>=2.10",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]
plots = ["matplotlib>=3.9"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
